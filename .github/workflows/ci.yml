name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install package (without the model runtime; tests use a fake model)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --no-deps
          pip install pydub fastapi "uvicorn[standard]" python-multipart pytest pytest-cov httpx ruff
          python -c "import sys; sys.version_info >= (3, 13) and __import__('subprocess').check_call([sys.executable, '-m', 'pip', 'install', 'audioop-lts'])"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov=transcription_pipeline --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t transcription-pipeline:ci .
